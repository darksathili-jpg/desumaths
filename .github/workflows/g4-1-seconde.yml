name: Desumaths - publication rapide main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desumaths-g4-1-seconde
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identifier exactement la revision testee
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4-1-seconde
          printf 'commit=%s\nbranch=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_WORKFLOW" > artifacts/g4-1-seconde/revision.txt
          git rev-parse HEAD | grep -Fx "$GITHUB_SHA"
      - name: Tests de protection des mathématiques
        run: npm run check
      - name: Construction des pages du site
        run: npm run build:web
      - name: Vérifier les fichiers et tous les liens internes
        run: |
          npm run check:web
          npm run audit:web
          node scripts/check-g4-1-web.cjs
      - name: Restaurer les ressources LaTeX et TikZ mises en cache
        id: cached-tex
        uses: actions/cache@v4
        with:
          path: |
            dist/web/Serveur Latex
            dist/web/texlive
            dist/web/vendor/tikzjax
          key: desumaths-web-engines-v1-f80f84659c9476e41ef7212f6d753e10f6bd4af5-20412fc9324a80416063fa9c9d2924df60179baa
      - name: Installer les moteurs uniquement si le cache est absent
        if: steps.cached-tex.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/desumaths-latex-upstream
          git -C /tmp/desumaths-latex-upstream init -q
          git -C /tmp/desumaths-latex-upstream remote add origin https://github.com/sean-reid/latex-preview.git
          git -C /tmp/desumaths-latex-upstream fetch --depth=1 origin f80f84659c9476e41ef7212f6d753e10f6bd4af5
          git -C /tmp/desumaths-latex-upstream checkout -q --detach FETCH_HEAD
          node scripts/install-web-latex-runtime.cjs /tmp/desumaths-latex-upstream
          mkdir -p /tmp/desumaths-tikzjax-upstream
          git -C /tmp/desumaths-tikzjax-upstream init -q
          git -C /tmp/desumaths-tikzjax-upstream remote add origin https://github.com/darksathili-jpg/latex_tikz.git
          git -C /tmp/desumaths-tikzjax-upstream fetch --depth=1 origin 20412fc9324a80416063fa9c9d2924df60179baa
          git -C /tmp/desumaths-tikzjax-upstream checkout -q --detach FETCH_HEAD
          node scripts/stage-tikzjax-web.cjs /tmp/desumaths-tikzjax-upstream
      - name: Vérifier toutes les ressources indispensables avant publication
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/web/Serveur Latex/swiftlatexpdftex.wasm"
          test -s "dist/web/Serveur Latex/swiftlatexpdftex.js"
          test -s "dist/web/texlive/pdftex/10/swiftlatexpdftex.fmt"
          test -s "dist/web/texlive/pdftex/26/article.cls"
          test -s "dist/web/texlive/manifest.json"
          test -s "dist/web/vendor/tikzjax/tikzjax.js"
          test -s "dist/web/vendor/tikzjax/run-tex.js"
          test -s "dist/web/vendor/tikzjax/core.dump.gz"
          test -s "dist/web/vendor/tikzjax/tex.wasm.gz"
          test -s "dist/web/vendor/tikzjax/tex_files/tkz-tab.sty.gz"
          test -s "dist/web/vendor/tikzjax/tex_files/pgfplots.sty.gz"
          test -s "dist/web/1ST/Fonctions/Fonctions degre 2/Sommet/Degre2Sommet.html"
          test -s "dist/web/1ST/Fonctions/Fonctions degre 2/Sommet/Scriptdegre2Sommet.js"
      - name: Inscrire la révision exacte dans le site
        shell: bash
        run: |
          printf '{"branch":"%s","commit":"%s","status":"published-build"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/web/g4-1-build.json
      - name: Préparer la publication GitHub Pages après recette complète
        uses: actions/configure-pages@v5
      - name: Charger le site complet et vérifié pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: desumaths-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site testé
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier la révision réellement visible sur le site public
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "${DEPLOYMENT_URL%/}/g4-1-build.json?revision=$GITHUB_SHA" -o /tmp/g41-public-build.json; then
              if python3 -c 'import json,os; x=json.load(open("/tmp/g41-public-build.json")); assert x["commit"]==os.environ["GITHUB_SHA"] and x["status"]=="published-build"'; then
                echo "Révision publiée, vérification de la vraie page Sommet…"
                PAGE_URL="${DEPLOYMENT_URL%/}/1ST/Fonctions/Fonctions%20degre%202/Sommet/Degre2Sommet.html"
                curl -fsSL --retry 3 --retry-delay 2 --max-time 20 "$PAGE_URL" -o /tmp/desumaths-public-sommet.html
                grep -Fq 'class="dm-layout"' /tmp/desumaths-public-sommet.html
                grep -Fq 'Scriptdegre2Sommet.js' /tmp/desumaths-public-sommet.html
                echo "Version publique et présentation modernisée de Sommet vérifiées : $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'ERREUR : revision publiee non confirmee, controler GitHub Pages.' >&2
          exit 1
