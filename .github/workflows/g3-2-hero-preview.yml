name: Desumaths G3.2 - Christophe 12 poses (previsualisation)
on:
  push:
    branches: [feature/g3-2-hero-12-poses]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: desumaths-g3-2-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests mathematiques, sauvegarde des gabarits et sprite
        run: npm run check
      - name: Construction du site Web
        run: npm run build:web
      - name: Verifier les ressources de l'export
        run: npm run check:web
      - name: Audit liens internes
        run: npm run audit:web
      - name: Verification des 12 poses et des pages corrigees
        shell: bash
        run: |
          set -euo pipefail
          test -s 'dist/web/assets/mascotte/christophe-12-poses.avif'
          test -s 'dist/web/components/hero/hero.js'
          test -s 'dist/web/components/hero/hero.css'
          test -s 'dist/web/2nde/Equations/Equations avec factorisation/EqsFacteurcommun.html'
          grep -q 'id="hero-compagnon"' dist/web/index.html
          grep -q 'data-hero-walk' dist/web/index.html
          grep -q 'data-hero-turn' dist/web/index.html
      - name: Installer les controles Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/desumaths-g3-pw --no-save --no-audit --no-fund playwright@1.65.0
          command -v google-chrome
      - name: Tests navigateurs avec vraies animations et vrai MathJax
        shell: bash
        env:
          NODE_PATH: /tmp/desumaths-g3-pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/web > /tmp/desumaths-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1
          node scripts/visual-check-r16.cjs
          node scripts/visual-check-g3.cjs
      - name: Conserver les captures de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desumaths-g3-2-12-poses-captures
          path: |
            artifacts/g3-hero
            artifacts/r16-layout
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: desumaths-preview-g3-2
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
