name: Desumaths G3.3 - Christophe guide des menus
on:
  push:
    branches: [feature/g3-3-guide-menus]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: desumaths-g3-3-menu-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests mathematiques et composants
        run: npm run check
      - name: Construire les pages Web
        run: npm run build:web
      - name: Tester le Web et les liens internes
        run: |
          npm run check:web
          npm run audit:web
      - name: Valider les fichiers du compagnon et les exercices corriges
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/web/components/hero/hero.js
          test -s dist/web/components/hero/hero.css
          test -s dist/web/components/hero/hero-menu.css
          test -s dist/web/Menus/compagnon-menu.js
          test -s dist/web/assets/mascotte/christophe-12-poses.avif
          test -s 'dist/web/2nde/Equations/Equations avec factorisation/EqsFacteurcommun.html'
          grep -q 'compagnon-menu.js' dist/web/Menus/rendu-menu.js
      - name: Installer le pilote de Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/desumaths-g3-pw --no-save --no-audit --no-fund playwright@1.65.0
          command -v google-chrome
      - name: Recette Chrome des exercices, de l'accueil et des menus
        shell: bash
        env:
          NODE_PATH: /tmp/desumaths-g3-pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/web > /tmp/desumaths-g3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1
          node scripts/visual-check-r16.cjs
          node scripts/visual-check-g3.cjs
          node scripts/visual-check-g3-menus.cjs
      - name: Conserver les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desumaths-g3-3-menus-captures
          path: |
            artifacts/g3-menus
            artifacts/g3-hero
            artifacts/r16-layout
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: desumaths-preview-g3-3
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
