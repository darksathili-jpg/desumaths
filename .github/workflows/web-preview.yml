name: Desumaths — préproduction web (déclenchement manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desumaths-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier les sources
        run: |
          test -f renderer/index.html
          test -f renderer/Menus/rendu-menu.js
          test -f scripts/build-web.cjs
      - name: Vérifier les tests structurels sans installer Electron
        run: npm run check
      - name: Construire le site Web
        run: npm run build:web
      - name: Vérifier les ressources exportées
        run: npm run check:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
